name: Automated News Ingestion Pipeline

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Web Scraper & Cloud AI Summarization Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
        run: node ingest.js

      - name: Update Article Statistics (Points & Comments)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/update_scores.js

      - name: Cleanup Inactive Guest Accounts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/cleanup_guests.js

      - name: Database Cleanup (Old Articles)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/db_cleanup.js
